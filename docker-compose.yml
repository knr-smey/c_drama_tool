services:
  khmerdubstudio:
    build: .
    image: khmerdubstudio:latest
    container_name: khmerdubstudio
    ports:
      - "8080:8080"
    environment:
      KHMERDUB_HOST: 0.0.0.0
      KHMERDUB_PORT: "8080"
    volumes:
      # Finished videos and uploads are written here on the host
      - ./output:/app/output
      # Cache faster-whisper models between runs
      - khmerdub_models:/root/.cache/huggingface
    restart: unless-stopped

volumes:
  khmerdub_models:
